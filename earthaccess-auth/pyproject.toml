[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "earthaccess-auth"
dynamic = ["version"]
description = "NASA Earthdata Login (EDL) authentication core, extracted from earthaccess"
authors = [{ name = "earthaccess contributors" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests >=2.26",
  "tinynetrc >=1.3.1",
  # for @deprecated on Auth.refresh_tokens; drop when floor reaches 3.13
  # (warnings.deprecated) or if the deprecated shim is not carried over
  "typing_extensions >=4.5",
]

[project.optional-dependencies]
fsspec = [
  "fsspec >=2025.2",
  "aiohttp >=3.8",
]
obstore = [
  "obstore >=0.9",
]

[dependency-groups]
docs = [
  "mkdocs >=1.2,!=1.6.0,<2.0",
  "mkdocs-material >=9.7.1,<10.0",
  "mkdocstrings[python] >=0.19.0",
  "pymdown-extensions >=9.2",
  "pygments >=2.11.1",
  # so mkdocstrings can import adapters.fsspec / adapters.obstore for their docstrings
  "earthaccess-auth[fsspec,obstore]",
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/earthaccess_auth"]

[tool.pytest.ini_options]
filterwarnings = ["error::UserWarning"]
